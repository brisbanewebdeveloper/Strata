# Use with compose.yaml after downloading and verifying both Huihui Swift shards.
# https://huggingface.co/huihui-ai/Huihui-Qwen3.8-Flash-Next-abliterated-GGUF
services:
  strata:
    build:
      args:
        CUDA_ARCHITECTURES: "${STRATA_CUDA_ARCHITECTURES:-89}"
        BUILD_VISION: "0"
    environment:
      FAMILY: swift
      MODEL: IQ3_XXS
      CONTEXT: "${STRATA_CONTEXT:-163840}"
      PARALLEL: "1"
      VISION: "no"
      GGUF_DIR: /gguf
      # Explicit launch values also replace older persisted engine overrides.
      STRATA_SET: "${STRATA_SET:-STRATA_NO_ARENA_THP=1} STRATA_UNBUFFERED_LOAD=1 resident-budget-gib=${STRATA_RESIDENT_BUDGET_GIB:-24} ram-keep-gib=${STRATA_RAM_KEEP_GIB:-8}"
    # Equal limits allow no additional container swap beyond the RAM allowance.
    mem_limit: "${STRATA_HUIHUI_MEMORY_LIMIT:-48g}"
    memswap_limit: "${STRATA_HUIHUI_MEMORY_LIMIT:-48g}"
    volumes:
      # Separate packs/configs from ordinary Swift weights with the same filenames.
      - strata-huihui-data:/data
      - type: bind
        source: "${STRATA_GGUF_DIR:-./models/huihui-swift-iq3_xxs}"
        target: /gguf
        read_only: true
        bind:
          create_host_path: false

volumes:
  strata-huihui-data:

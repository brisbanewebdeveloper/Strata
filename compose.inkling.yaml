# Standalone Strata setup for the verified Inkling 2 Mini SQ-15 files.
# Download the files with bash tools/docker/download-inkling-sq15.sh first.
# Optional: set STRATA_INKLING_MODELS_DIR or STRATA_INKLING_GPU_DEVICE.
# Set STRATA_BIND and STRATA_PORT in .env to share the host address and port
# with the Swift setup. For LAN access, use the host's LAN IP as STRATA_BIND.
# Start: docker compose -f compose.inkling.yaml up -d
# Stop:  docker compose -f compose.inkling.yaml down
# Set STRATA_API_KEY in .env before starting Compose.
name: strata-inkling

services:
  strata:
    image: ghcr.io/niko1221/strata:0.2.21-cuda13
    container_name: strata-inkling
    restart: "no"
    ports:
      - "${STRATA_BIND:-127.0.0.1}:${STRATA_PORT:-18080}:8080"
    environment:
      API_KEY: "${STRATA_API_KEY:?Set STRATA_API_KEY before starting Compose}"
      FAMILY: inkling-2-mini
      MODEL: SQ-15
      MODEL_PATH: /models/Inkling-2-Mini-SQ-15-abliterated.strata
      CONTEXT: "262144"
      KV: fp8
      PARALLEL: "1"
      VISION: "off"
      DRAFTING: "off"
    volumes:
      - type: volume
        source: data
        target: /data
      - type: bind
        source: "${STRATA_INKLING_MODELS_DIR:-./models/inkling-2-mini-sq15}"
        target: /models
        read_only: true
        bind:
          create_host_path: false
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids:
                - "${STRATA_INKLING_GPU_DEVICE:-0}"
              capabilities: [gpu]
    ulimits:
      memlock:
        soft: -1
        hard: -1
    shm_size: 2gb
    stop_grace_period: 2m

volumes:
  data:

# Standalone Strata setup for the verified Inkling 2 Mini SQ-15 files.
# Download the files with bash tools/docker/download-inkling-sq15.sh first.
# Optional: set STRATA_INKLING_MODELS_DIR, STRATA_INKLING_PORT, or
# STRATA_INKLING_GPU_DEVICE.
# Start: docker compose -f compose.inkling.yaml up -d
# Stop:  docker compose -f compose.inkling.yaml down
# Show the generated API key: docker exec strata-inkling strata launch --show-key --preset docker
name: strata-inkling

services:
  strata:
    image: ghcr.io/niko1221/strata:0.2.21-cuda13
    container_name: strata-inkling
    restart: "no"
    ports:
      - "127.0.0.1:${STRATA_INKLING_PORT:-18080}:8080"
    environment:
      FAMILY: inkling-2-mini
      MODEL: SQ-15
      MODEL_PATH: /models/Inkling-2-Mini-SQ-15-abliterated.strata
      CONTEXT: "262144"
      KV: fp8
      PARALLEL: "1"
      VISION: "off"
      DRAFTING: "off"
    volumes:
      - type: volume
        source: data
        target: /data
      - type: bind
        source: "${STRATA_INKLING_MODELS_DIR:-./models/inkling-2-mini-sq15}"
        target: /models
        read_only: true
        bind:
          create_host_path: false
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids:
                - "${STRATA_INKLING_GPU_DEVICE:-0}"
              capabilities: [gpu]
    ulimits:
      memlock:
        soft: -1
        hard: -1
    shm_size: 2gb
    stop_grace_period: 2m

volumes:
  data:
